<!DOCTYPE html>
<html>
<head>
  <style>
    /* Put main and aside next to each other */
    body {
      display: flex;
      gap: 20px;
      font-family: sans-serif;
    }

    /* Main article takes most of the space */
    main {
      flex: 3;
      background: lightblue;
      padding: 20px;
    }

    /* Aside acts as the sidebar on the side */
    aside {
      flex: 1;
      background: lightyellow;
      padding: 20px;
    }
  </style>
</head>
<body>

  <main>
    <h1>My Main Article</h1>
    <p>This is the primary story or topic of the page.</p>
  </main>

  <aside>
    <h2>Sidebar (Aside)</h2>
    <p>Extra info: Related links, quick notes, or ads.</p>
  </aside>

</body>
</html>
