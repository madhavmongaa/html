<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>Forms</h2>
    <form action="/submit" method="post">
        <label for="name">Name:</label>
        <input type="text" placeholder="John Doe" id="name" name="name" required>
        <br><hr><br>
        <label for="email">Email:</label>
        <input type="email" placeholder="you@example.com" id="email" name="email" required>
        <br><hr><br>
        <label for ="password">Password:</label>
        <input type="password" placeholder="MAKE IT HARD" id="password" name="password" required>
        <br><hr><br>
        <label for="birthdate">DOB:</label>
        <input type="date" id="birthdate" name="birthdate" required>
        <br><hr><br>
        <input type="checkbox" id="subscribe" name="subscribe">
        <label for="subscribe">Subscribe to newsletter</label>
        <br><hr><br>
        <input type="submit" value="Submit">
    </form>
    
</body>
</html>
